{% extends "base.html" %}

{% block content %}

<div class="max-w-3xl mx-auto py-24 text-center">

    <div class="w-28 h-28 mx-auto rounded-full bg-green-100 flex items-center justify-center">

        <i class="fa-solid fa-check text-5xl text-green-600"></i>

    </div>

    <h1 class="text-5xl font-bold mt-10">

        Thank You!

    </h1>

    <p class="text-gray-500 text-xl mt-5">

        Your order has been placed successfully.

    </p>

    <div class="mt-10 bg-white rounded-3xl shadow border p-8">

        <h2 class="text-2xl font-bold mb-6">

            Order Information

        </h2>

        <div class="flex justify-between py-3">

            <span>Order ID</span>

            <strong>#{{ order.id }}</strong>

        </div>

        <div class="flex justify-between py-3">

            <span>Name</span>

            <strong>

                {{ order.first_name }} {{ order.last_name }}

            </strong>

        </div>

        <div class="flex justify-between py-3">

            <span>Email</span>

            <strong>

                {{ order.email }}

            </strong>

        </div>

        <div class="flex justify-between py-3">

            <span>Total</span>

            <strong class="text-indigo-600">

                ${{ order.get_total_price }}

            </strong>

        </div>

    </div>

    <a
        href="{% url 'home' %}"
        class="inline-block mt-10 bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-4 rounded-2xl">

        Back To Home

    </a>

</div>

{% endblock %}
