{% extends "base.html" %}

{% block title %}
Login | Sam Store
{% endblock %}

{% block content %}

<div class="min-h-screen bg-gray-50 dark:bg-gray-950 transition-colors duration-300 flex items-center justify-center px-6 py-16">

    <div class="w-full max-w-md">

        <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-800 p-10 transition-colors duration-300">

            <div class="text-center mb-10">

                <h1 class="text-4xl font-black text-gray-900 dark:text-white">
                    Welcome Back
                </h1>

                <p class="mt-3 text-gray-500 dark:text-gray-400">
                    Login to your Sam Store account
                </p>

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="space-y-6">

                    <div>

                        <label class="block mb-2 font-semibold text-gray-700 dark:text-gray-300">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            required
                            class="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none transition">

                    </div>

                    <div>

                        <label class="block mb-2 font-semibold text-gray-700 dark:text-gray-300">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            required
                            class="w-full rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none transition">

                    </div>

                </div>

                {% if form.errors %}

                <div class="mt-6 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-300 rounded-xl px-4 py-3">

                    Invalid username or password.

                </div>

                {% endif %}

                <button
                    type="submit"
                    class="mt-8 w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-4 text-lg font-bold transition">

                    Login

                </button>

            </form>

            <div class="mt-8 text-center">

                <p class="text-gray-500 dark:text-gray-400">

                    Don't have an account?

                    <a href="#" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
