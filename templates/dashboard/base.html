{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Dashboard{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

    <!-- Sidebar -->

    <aside class="w-72 bg-gray-900 text-white flex flex-col">

        <div class="p-8 border-b border-gray-700">

            <h1 class="text-3xl font-bold">

                MyShop

            </h1>

            <p class="text-gray-400 mt-2">

                Admin Dashboard

            </p>

        </div>

        <nav class="flex-1 mt-8">

            <a href="{% url 'dashboard' %}"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-chart-line"></i>

                Dashboard

            </a>

            <a href="/admin/products/product/"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-box"></i>

                Products

            </a>

            <a href="/admin/orders/order/"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-shopping-cart"></i>

                Orders

            </a>

            <a href="/admin/auth/user/"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-users"></i>

                Users

            </a>

            <a href="/admin/products/review/"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-star"></i>

                Reviews

            </a>

            <a href="/"
               class="flex items-center gap-4 px-8 py-4 hover:bg-indigo-600 transition">

                <i class="fas fa-home"></i>

                Website

            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="flex-1">

        <!-- Topbar -->

        <header class="bg-white shadow px-10 py-6 flex justify-between items-center">

            <h2 class="text-3xl font-bold">

                {% block page_title %}

                Dashboard

                {% endblock %}

            </h2>

            <div class="flex items-center gap-6">

                <span>

                    {{ request.user.username }}

                </span>

                <img
                    src="https://ui-avatars.com/api/?name={{ request.user.username }}"
                    class="w-12 h-12 rounded-full">

            </div>

        </header>

        <section class="p-10">

            {% block content %}

            {% endblock %}

        </section>

    </main>

</div>

</body>

</html>
