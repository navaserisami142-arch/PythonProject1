<section class="py-16 bg-white dark:bg-gray-950 transition-colors duration-300">

    <div class="max-w-7xl mx-auto px-8">

        <div class="flex justify-between items-center mb-10">

            <div>

                <h2 class="text-4xl font-bold text-gray-900 dark:text-white transition-colors duration-300">

                    Shop by Category

                </h2>

                <p class="text-gray-500 dark:text-gray-400 mt-2 transition-colors duration-300">

                    Find exactly what you're looking for.

                </p>

            </div>

        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6">

            {% for category in categories %}

            <a href="{% url 'product_list' %}?category={{ category.slug }}"
               class="group bg-gray-50 dark:bg-gray-900 rounded-3xl p-8 text-center
                      hover:bg-indigo-600 hover:text-white
                      transition-all duration-300">

                <div class="w-16 h-16 mx-auto rounded-full
                            bg-white dark:bg-gray-800
                            shadow flex items-center justify-center
                            text-3xl
                            text-gray-700 dark:text-gray-200
                            group-hover:bg-white group-hover:text-indigo-600
                            transition-all duration-300">

                    <i class="fa-solid fa-tags"></i>

                </div>

                <h3 class="mt-5 font-semibold text-gray-800 dark:text-gray-100 group-hover:text-white transition-colors duration-300">

                    {{ category.name }}

                </h3>

            </a>

            {% empty %}

            <div class="col-span-full text-center py-10">

                <p class="text-gray-500 dark:text-gray-400">

                    No categories found.

                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</section>
